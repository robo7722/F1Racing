<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart-Fahrer Vorschau</title>
<style>html,body{margin:0;height:100%;background:#1a1d22;overflow:hidden}</style></head><body>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// Prüfansicht: Kart (kart.bin) + Kart-Fahrer (kartfahrer.bin) + Helm + Lenkradkranz – gleiche Lade-Logik wie im Spiel
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { HELM_BIN } from './helm_bin.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x1a1d22); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = 0.7;
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 50); cam.position.set(2.4, 1.6, 2.6);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 0.5, 0); ctl.enableDamping = true;
if (q.has('cam')) { const [x, y, z, tx, ty, tz] = q.get('cam').split(',').map(Number); cam.position.set(x, y, z); ctl.target.set(tx, ty, tz); }
const key = new THREE.DirectionalLight(0xfff4e8, 2.2); key.position.set(2, 4, 2.5); s.add(key); s.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2622, 0.6));
const tl = new THREE.TextureLoader(), T = (u, srgb) => { const t = tl.load(u); t.flipY = false; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
// Kart
const kb = await fetch('../kart.bin').then(x => x.arrayBuffer()), hl = new DataView(kb).getUint32(0, true), kh = JSON.parse(new TextDecoder().decode(new Uint8Array(kb, 4, hl))), kbase = 4 + hl;
for (const c of kh.chunks) { if (c.name !== 'body') continue; const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(kb, kbase + c.pos, c.nv * 3).slice(), 3)); g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(kb, kbase + c.nrm, c.nv * 3).slice(), 3)); g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(kb, kbase + c.uv, c.nv * 2).slice(), 2)); g.setIndex(new THREE.BufferAttribute((c.i32 ? new Uint32Array(kb, kbase + c.idx, c.ni) : new Uint16Array(kb, kbase + c.idx, c.ni)).slice(), 1));
  const t = tl.load('../textures/kart_body.jpg'); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; s.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: t, roughness: .5, side: THREE.DoubleSide }))); }
// Lenkrad-Kranz
const sw = new THREE.Group(), az = new THREE.Vector3(0, 29, -36).normalize(), axx = new THREE.Vector3(-1, 0, 0), ay = new THREE.Vector3().crossVectors(az, axx);
sw.position.set(0, 0.5005, 0.1235); sw.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(axx, ay, az)); sw.add(new THREE.Mesh(new THREE.TorusGeometry(0.188, 0.021, 10, 36), new THREE.MeshStandardMaterial({ color: 0x151515 }))); s.add(sw);
// Fahrer
const fb = await fetch('../kartfahrer.bin').then(x => x.arrayBuffer()), fl = new DataView(fb).getUint32(0, true), fh = JSON.parse(new TextDecoder().decode(new Uint8Array(fb, 4, fl))), fbase = 4 + fl;
const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fb, fbase + fh.pos, fh.nv * 3), 3)); g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(fb, fbase + fh.nrm, fh.nv * 3), 3)); g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(fb, fbase + fh.uv, fh.nv * 2), 2));
g.setIndex(new THREE.BufferAttribute(fh.i32 ? new Uint32Array(fb, fbase + fh.idx, fh.ni) : new Uint16Array(fb, fbase + fh.idx, fh.ni), 1));
g.setAttribute('aReg', new THREE.BufferAttribute(Float32Array.from(new Uint8Array(fb, fbase + fh.reg, fh.nv)), 1));
g.setAttribute('aRy', new THREE.BufferAttribute(new Float32Array(fb, fbase + fh.ry, fh.nv), 1));
g.setAttribute('aRest', new THREE.BufferAttribute(new Float32Array(fb, fbase + fh.rest, fh.nv * 3), 3));
g.setAttribute('aRN', new THREE.BufferAttribute(new Int8Array(fb, fbase + fh.rn, fh.nv * 3), 3, true));
g.setAttribute('aBi', new THREE.BufferAttribute(Float32Array.from(new Uint8Array(fb, fbase + fh.bi, fh.nv * 4)), 4)); g.setAttribute('aBw', new THREE.BufferAttribute(new Uint8Array(fb, fbase + fh.bw, fh.nv * 4), 4, true));
sw.position.addScaledVector(az, fh.swExt || 0); const spin = -(+q.get('steer') || 0) * 1.6; sw.children[0].rotation.z = spin;   // Lenkrad wie im Spiel versetzt; ?steer=-1…1
// Material aus dem Spiel (Abschnitt KFMAT-START … KFMAT-END in index.html), Texturpfade eine Ebene höher
const src = await fetch('../index.html').then(x => x.text()), part = src.slice(src.indexOf('// KFMAT-START'), src.indexOf('// KFMAT-END')).replaceAll("'textures/", "'../textures/");
const KFAHRER = { swC: new THREE.Vector3(...fh.swC), swAx: new THREE.Vector3(...fh.swAx), arm: fh.arm.map(a => new THREE.Vector3(...a)), rimR: fh.rimR || 0.188 };
const { kartFahrerMat, kartArmsIK } = new Function('THREE', 'col', 'KFAHRER', part + '\nreturn { kartFahrerMat, kartArmsIK };')(THREE, h => new THREE.Color(h), KFAHRER);
const team = { suit: q.get('suit') || 'c8101c', acc: q.get('acc') || 'f0f0f0' };
if (q.has('debug')) { s.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: .75, side: THREE.FrontSide }))); s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.BackSide }))); }   // Prüfung: Rückseiten grün
else { const mt = kartFahrerMat('T', new THREE.Color('#' + team.suit), new THREE.Color('#' + team.acc)); kartArmsIK(mt.userData.U.uBone.value, spin); s.add(new THREE.Mesh(g, mt)); }
// Helm
const dec = (b, Ty) => { const s2 = atob(b), u = new Uint8Array(s2.length); for (let i = 0; i < u.length; i++) u[i] = s2.charCodeAt(i); return new Ty(u.buffer); };
const p16 = dec(HELM_BIN.p, Int16Array), n8 = dec(HELM_BIN.n, Int8Array), z8 = dec(HELM_BIN.z, Uint8Array), ix = dec(HELM_BIN.i, Uint16Array), n = z8.length, P = new Float32Array(n * 3), N = new Float32Array(n * 3);
for (let i = 0; i < n * 3; i++) { P[i] = p16[i] / 32767 * 0.25; N[i] = n8[i] / 127; }
const hg = new THREE.BufferGeometry(); hg.setAttribute('position', new THREE.BufferAttribute(P, 3)); hg.setAttribute('normal', new THREE.BufferAttribute(N, 3)); hg.setIndex(new THREE.BufferAttribute(ix, 1));
const hc = new Float32Array(n * 3); for (let i = 0; i < n; i++) new THREE.Color(z8[i] === 1 ? 0x101010 : z8[i] > 1 ? 0x050505 : 0xd4121e).toArray(hc, i * 3); hg.setAttribute('color', new THREE.BufferAttribute(hc, 3));
hg.setAttribute('aZone', new THREE.BufferAttribute(Float32Array.from(z8), 1));
const hmat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: .25, clearcoat: 1, side: THREE.DoubleSide });
hmat.onBeforeCompile = sh => {   // wie helmMat im Spiel: Zone 2 (Heckspoiler-Innenteil) und Kinnteil unter dem Visier ausblenden
  sh.vertexShader = 'attribute float aZone; varying float vHZ; varying vec3 vHP;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vHP = position / 0.15; vHZ = aZone;');
  sh.fragmentShader = 'varying float vHZ; varying vec3 vHP;\n' + sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n vec3 p = vHP; if (vHZ > 1.5 && vHZ < 2.5) discard; if (vHZ > 2.5 && ((p.z > 0.6 && p.y > -0.76 && p.y < -0.2) || p.y < -0.8)) discard;'); };
const helm = new THREE.Mesh(hg, hmat); helm.position.fromArray(fh.helm); helm.rotation.x = fh.helmTilt; helm.scale.setScalar(1.1); s.add(helm);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(s, cam); }); setTimeout(() => window.__ready = true, 1500);
</script></body></html>
