<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rennfahrer Vorschau</title>
<style>html,body{margin:0;height:100%;background:#1a1d22;overflow:hidden;font:14px system-ui,sans-serif;color:#ddd}#i{position:absolute;left:16px;top:12px;opacity:.7}</style>
</head>
<body>
<div id="i">Rennfahrer · ziehen zum Drehen</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { HELM_BIN } from './helm_bin.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x1a1d22); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = 0.6;
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50); cam.position.set(1.4, 1.3, 3.6);
const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 0.95, 0); ctl.enableDamping = true;
if (q.has('cam')) { const [x, y, z, tx, ty, tz] = q.get('cam').split(',').map(Number); cam.position.set(x, y, z); ctl.target.set(tx, ty, tz); }
const key = new THREE.DirectionalLight(0xfff4e8, 2.4); key.position.set(2, 3.5, 2.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -1, right: 1, top: 2, bottom: -0.2 }); key.shadow.normalBias = 0.02; s.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.8); rim.position.set(-2.5, 2.5, -2.8); s.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x24282e, roughness: .7 })); floor.receiveShadow = true; s.add(floor);
const sh = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
const L = new GLTFLoader(), [body, glove] = await Promise.all([L.loadAsync('fahrer.glb'), L.loadAsync('handschuh.glb')]);
s.add(sh(body.scene));
const gR = sh(glove.scene), gL = gR.clone(); gL.scale.x = -1; s.add(gR, gL);   // linker Handschuh = gespiegelter rechter
// Helm aus dem Spiel (HELM_BIN, Design wie Fahrer NEM)
const dec = (b, T) => { const s2 = atob(b), u = new Uint8Array(s2.length); for (let i = 0; i < u.length; i++) u[i] = s2.charCodeAt(i); return new T(u.buffer); };
const p16 = dec(HELM_BIN.p, Int16Array), n8 = dec(HELM_BIN.n, Int8Array), z8 = dec(HELM_BIN.z, Uint8Array), ix = dec(HELM_BIN.i, Uint16Array), n = z8.length, P = new Float32Array(n * 3), N = new Float32Array(n * 3);
for (let i = 0; i < n * 3; i++) { P[i] = p16[i] / 32767 * 0.25; N[i] = n8[i] / 127; }
for (let i = 0; i < n; i++) if (z8[i] === 1) { const x = P[i * 3], y = P[i * 3 + 1] * 0.5, z = P[i * 3 + 2] + 0.03, l = Math.hypot(x, y, z) || 1; N[i * 3] = x / l; N[i * 3 + 1] = y / l; N[i * 3 + 2] = z / l; }
const hg = new THREE.BufferGeometry(); hg.setAttribute('position', new THREE.BufferAttribute(P, 3)); hg.setAttribute('normal', new THREE.BufferAttribute(N, 3)); hg.setAttribute('aZone', new THREE.BufferAttribute(Float32Array.from(z8), 1)); hg.setIndex(new THREE.BufferAttribute(ix, 1)); hg.computeBoundingBox();
const hm = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .24, metalness: .1, clearcoat: 1, clearcoatRoughness: .08, side: THREE.DoubleSide });
hm.onBeforeCompile = sh2 => { Object.assign(sh2.uniforms, { uA: { value: new THREE.Color(0x3a3d44) }, uB: { value: new THREE.Color(0xe10600) }, uC: { value: new THREE.Color(0xf2f2f2) }, uV: { value: new THREE.Color(0x100808) } });
  sh2.vertexShader = 'attribute float aZone; varying float vHZ; varying vec3 vHP;\n' + sh2.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vHP = position / 0.15; vHZ = aZone;');
  sh2.fragmentShader = 'uniform vec3 uA, uB, uC, uV; varying float vHZ; varying vec3 vHP;\n' + sh2.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
    { vec3 p = vHP, c = uA; float w = 0.012, a = abs(p.x); c = mix(uC, c, smoothstep(0.27, 0.27 + w, a)); c = mix(uB, c, smoothstep(0.17, 0.17 + w, a));
      if (vHZ > 1.5 && vHZ < 2.5) discard; if (vHZ > 2.5) c = vec3(0.012); else if (vHZ > 0.5) c = uV; diffuseColor.rgb = c; }`); };
const helm = new THREE.Mesh(hg, hm), hb = hg.boundingBox, HS = 1.0;
// Kopf des Tripo-Modells lag bei x ±0,07, y 0,825…1,0, z −0,075…0,092 (×1,78 m): Helm mittig darauf, Unterkante am Kragen
helm.scale.setScalar(HS); helm.position.set(0, 1.47 - hb.min.y * HS, 0.015 - (hb.max.z + hb.min.z) / 2 * HS); helm.castShadow = true; s.add(helm);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
r.setAnimationLoop(() => { ctl.update(); r.render(s, cam); }); setTimeout(() => window.__ready = true, 1200);
</script>
</body>
</html>
